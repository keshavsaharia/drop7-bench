<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" width="100%" role="img" aria-labelledby="fig-evidence-timeline-title fig-evidence-timeline-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-evidence-timeline-title">Logged outcomes per day, 2026-08-20 to 2026-08-23 — the negative-results column is the honest picture</title>
<desc id="fig-evidence-timeline-desc">Logged outcomes per day, 2026-08-20 to 2026-08-23 — the negative-results column is the honest picture. Counts are the outcome tallies recorded in each day's log frontmatter (web/content/log/2026-08-2*.mdx, the 'outcomes' block), copied verbatim: 2026-08-20 positive 2 / negative 5 / open 3; 2026-08-21 positive 2 / negative 7 / open 6; 2026-08-22 positive 2 / negative 2 / open 1; 2026-08-23 positive 1 / negative 5 / open 2. The figure plan (written mid-day on 2026-08-23) carried 0 / 2 / 1 for 2026-08-23; the finalized log frontmatter reads 1 / 5 / 2 and is charted — plan-vs-record drift resolved in the record's favour. Milestones behind these counts (verbatim anchors): the 400,675-point eight-game D4 confirmation (docs/strategies.md, Current reference table); the 398,498 d4s7 64-game confirmation mean (finding-05); the 386,545 frozen-arm mean over 256 fresh games (RS-20260823T131226Z-16564ed9, metrics.frozenArmFreshBaseline). Kind is dot rather than the plan's line because the generator requires numeric x for line charts and the task specifies string date categories. Sources: web/content/log/2026-08-20.mdx, web/content/log/2026-08-21.mdx, web/content/log/2026-08-22.mdx, web/content/log/2026-08-23.mdx.</desc>
