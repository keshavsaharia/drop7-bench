<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 434" width="100%" role="img" aria-labelledby="fig-score-vs-depth-title fig-score-vs-depth-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-score-vs-depth-title">Mean score against search depth, fair expectimax, by chance-stratum count</title>
<desc id="fig-score-vs-depth-desc">Mean score against search depth, fair expectimax, by chance-stratum count. All arms play the same 64-seed development cohort 0xa51d1000-0xa51d103f under corrected 17,000-point Hardcore scoring, except the depth-5 seven-stratum arm, which was stopped by decision after the first 32 seeds (0xa51d1000-0xa51d101f) and is drawn as its own one-point series so the two sample sizes are never joined by a line. Depth 2 was run only at seven strata. No confidence band is drawn on means; the paired contrasts with their bounds are in the companion bar figure. Evidence tier: development / public-development. The historical eight-game D3/D4 cohorts used 7,000-point scoring and are not shown. Sources: docs/exploratory/finding-05-chance-strata.md, RS-20260821T181917Z-9a34ba02, RS-20260821T205102Z-d89df4b5.</desc>
