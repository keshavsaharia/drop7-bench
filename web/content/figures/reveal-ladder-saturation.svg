<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" width="100%" role="img" aria-labelledby="fig-reveal-ladder-saturation-title fig-reveal-ladder-saturation-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-reveal-ladder-saturation-title">Reveal-sample ladder: mean score against joint (disc, reveal) coverage — saturation at M about 6</title>
<desc id="fig-reveal-ladder-saturation-desc">Reveal-sample ladder: mean score against joint (disc, reveal) coverage — saturation at M about 6. Cohort 0xa51d1000-0xa51d103f, n=64 per arm, corrected 17,000-point Hardcore scoring, all from RS-20260821T192140Z-189fe392 (valid, fail/not-supported-as-tested for the compounding theory). Coverage values are metrics.jointCoverageByM (0.143 / 0.286 / 0.429 / 0.857 / 1.0) expressed in percent. The M=6 to M=12 step is -27,097 with interval (-83,807, +31,209), W-T-L 28-0-36: saturation, not regression (metrics.pairedD3M12MinusD3M6). Score, moves, numbered clears and covered reveals all peak at M=6; only mean occupancy improves monotonically to 100% coverage (finding-16). The depth-4 series tested only M=1 and M=2 (28.6% coverage); the wide depth-4 arm was never affordable. The d4 M=1 comparator mean (398,498) is quoted in the record's summary and recorded in finding-15 section 8.3. Evidence tier: public-development. Sources: RS-20260821T192140Z-189fe392.</desc>
