<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" width="100%" role="img" aria-labelledby="fig-gap-decomposition-corrected-title fig-gap-decomposition-corrected-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-gap-decomposition-corrected-title">Share of the clairvoyant-minus-D4 clear-rate gap closed by fair planning — the finding-12 correction</title>
<desc id="fig-gap-decomposition-corrected-desc">Share of the clairvoyant-minus-D4 clear-rate gap closed by fair planning — the finding-12 correction. finding-07 section 2 (eight master tapes, 0xa5230000-0xa5230007) against finding-12 section 2's corrected decomposition (all four arms on the same 32 fresh tapes, fully matched). The 'not closed' category is the H=7 residual in both documents; finding-07's H=5 residual (60.0% unattributed) is not plotted. A third finding-12 figure, 15.3% at H=5 against the 0.3798 fresh-tape gap denominator (section 2, 'what must be weakened'), uses a different denominator than its own matched-cohort table and is carried here in notes only, not charted: one denominator per series. finding-07 is not withdrawn — its method, information-boundary gate, arm-A result (the future disc tape is worth nothing) and qualitative conclusion stand; the correction halves the quantitative share. Evidence tier: exploratory, with the correction notice being the point of the figure. Sources: docs/exploratory/finding-07-fair-planning-ceiling.md, docs/exploratory/finding-12-fair-planner-ceiling-extended.md.</desc>
