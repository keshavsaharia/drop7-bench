<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 434" width="100%" role="img" aria-labelledby="fig-score-vs-work-frontier-title fig-score-vs-work-frontier-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-score-vs-work-frontier-title">Mean score against logical work per move — the flat-topped budget frontier</title>
<desc id="fig-score-vs-work-frontier-desc">Mean score against logical work per move — the flat-topped budget frontier. Cohort 0xa51d1000-0xa51d103f, corrected 17,000-point Hardcore scoring, n=64 per arm except the d5s7 point (32 of 64 planned games, stopped by decision, final), which is drawn as its own dashed one-point series so the two sample sizes are never joined by a line. Cache capacity differs across arms (60,000 entries for the recorded depth-4 comparators, 200,000 for the depth-5 arms, auto-sized 960,695 / 346,921 for the new reveal-sampling arms); capacity provably cannot change play but work per move is not comparable across capacities (finding-16 Limitations; RS-20260821T205102Z-d89df4b5 limitations). Equal-work pair: d3 M=6 (4,244,020; 376,442) vs d4 M=1 (4,956,614; 398,498) is statistically indistinguishable (paired -22,056 [-89,867, +46,009], RS-20260821T192140Z-189fe392 pairedD3M6MinusD4M1). The x axis is linear: the plan's log-scale recommendation is not expressible by the generator, and the d5s7 point dominates the range. Evidence tier: development / public-development. Sources: docs/exploratory/finding-05-chance-strata.md, RS-20260821T192140Z-189fe392, docs/exploratory/finding-15-depth5-exact-estimator.md, RS-20260821T205102Z-d89df4b5.</desc>
