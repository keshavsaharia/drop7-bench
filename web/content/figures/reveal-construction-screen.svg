<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" width="100%" role="img" aria-labelledby="fig-reveal-construction-screen-title fig-reveal-construction-screen-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-reveal-construction-screen-title">Reveal-construction leaf term screen: candidate minus frozen fair D4 at seven strata (fresh seeds)</title>
<desc id="fig-reveal-construction-screen-desc">Reveal-construction leaf term screen: candidate minus frozen fair D4 at seven strata (fresh seeds). Paired screen on fresh seeds 0xa52d0200-0xa52d02ff, fair D4 at seven strata with the memo engine. Whisker is the one-sided 95% bootstrap lower bound. A900 completed all 256 games (gate FAIL; detection floor 30,957). A300 and bundle B were stopped at the 32-game rarity check because they changed the search's column in under 1% of decisions; their deltas are partials on 39 and 36 games and are non-measurements. Run validity valid, scientific outcome fail, evidence tier public-development. Sources: RS-20260823T131226Z-16564ed9.</desc>
