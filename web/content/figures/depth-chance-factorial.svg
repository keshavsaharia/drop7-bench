<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" width="100%" role="img" aria-labelledby="fig-depth-chance-factorial-title fig-depth-chance-factorial-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-depth-chance-factorial-title">Mean score by search depth and chance resolution (shared cohort)</title>
<desc id="fig-depth-chance-factorial-desc">Mean score by search depth and chance resolution (shared cohort). Cohort 0xa51d1000-0xa51d103f, corrected 17,000-point Hardcore scoring, 64 games per cell except the depth-5 seven-stratum arm, which was stopped by decision after the first 32 seeds (0xa51d1000-0xa51d101f) and is final. The stopped arm is drawn as its own dashed one-point series so the two sample sizes are never joined by a line (same convention as score-vs-depth). No per-mean confidence intervals are recorded anywhere for these arms; the bounds on the paired contrasts live in detection-floor-map. The d2s5 mean is the coordinator-supplied figure printed in finding-10's position-mode table and in the 2026-08-21 log ArmTable (the log path is not an accepted sourceRecord scheme, so the finding is cited). Evidence tier: development / public-development. Sources: docs/exploratory/finding-10-suite-validation.md, docs/exploratory/finding-05-chance-strata.md, docs/exploratory/finding-15-depth5-exact-estimator.md, RS-20260821T205102Z-d89df4b5.</desc>
