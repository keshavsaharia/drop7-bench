.research-fig-svg .fig-pop rect { fill: var(--fig-pop-bg, #ffffff); stroke: var(--fig-pop-border, #d4d4d8); }
.research-fig-svg .fig-pop text { fill: var(--fig-fg, #222); }
.research-fig-svg .fig-pt:hover .fig-pop, .research-fig-svg .fig-pt:focus .fig-pop, .research-fig-svg .fig-pt:focus-within .fig-pop { display: block; }
.research-fig-svg .fig-pt:hover .fig-marker, .research-fig-svg .fig-pt:focus .fig-marker { stroke: var(--fig-fg, #222); stroke-width: 2; }
</style>
