.research-fig-svg .fig-tick { font-size: 11px; fill: var(--fig-muted, #888); }
.research-fig-svg .fig-note { font-size: 10px; fill: var(--fig-muted, #888); }
.research-fig-svg .fig-grid { stroke: var(--fig-grid, #d4d4d8); stroke-width: 1; }
.research-fig-svg .fig-accent-text { fill: var(--fig-accent, #2563eb); }
.research-fig-svg .fig-danger-text { fill: var(--fig-danger, #dc2626); }
