<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="100%" role="img" aria-labelledby="fig-diagram-occupancy-fixed-point-title fig-diagram-occupancy-fixed-point-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-diagram-occupancy-fixed-point-title">The occupancy fixed point: why ~20 cells attracts and fair D4 spirals (schematic)</title>
<desc id="fig-diagram-occupancy-fixed-point-desc">Schematic phase diagram, not measured data: x is occupied cells before the move (0-49), y is numbered clears per move. A dashed requirement line sits at 2.400 = 12/5, the exact disc-conservation rate from finding-01. A rising S-curve (clairvoyant rh-clears, schematic) crosses the requirement near 20 occupied cells, with restoring arrows on each side — below the crossing the board fills and clears rise, above it the board empties and clears fall — an attracting fixed point. A second hump-shaped curve (fair depth 4, schematic) peaks at 2.59 in the 25-29 cell band, only barely above the requirement, then falls; a one-way arrow past the hump is labelled deficit compounds, the death spiral. Caption: schematic — the measured curves are in the figure occupancy-clear-rate-equilibrium. Sources: docs/exploratory/finding-06-flow-ceiling.md sections 2-3, docs/exploratory/finding-01-score-is-survival.md, docs/exploratory/finding-12-fair-planner-ceiling-extended.md section 2.</desc>
