<marker id="d4-arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--fig-danger, #dc2626)"/></marker>
</defs>
<text class="fig-title" x="36" y="24">The occupancy fixed point: why ~20 cells attracts and fair D4 spirals (schematic)</text>
<text class="fig-sub" x="36" y="42">clears per move vs occupied cells — attracting equilibrium for the clairvoyant, death spiral for fair D4</text>

<line class="fig-grid" x1="90" y1="70" x2="700" y2="70"/><text class="fig-tick" x="82" y="74" text-anchor="end">6</text>
<line class="fig-grid" x1="90" y1="130" x2="700" y2="130"/><text class="fig-tick" x="82" y="134" text-anchor="end">5</text>
<line class="fig-grid" x1="90" y1="190" x2="700" y2="190"/><text class="fig-tick" x="82" y="194" text-anchor="end">4</text>
<line class="fig-grid" x1="90" y1="250" x2="700" y2="250"/><text class="fig-tick" x="82" y="254" text-anchor="end">3</text>
<line class="fig-grid" x1="90" y1="310" x2="700" y2="310"/><text class="fig-tick" x="82" y="314" text-anchor="end">2</text>
<line class="fig-grid" x1="90" y1="370" x2="700" y2="370"/><text class="fig-tick" x="82" y="374" text-anchor="end">1</text>
<line class="fig-grid" x1="90" y1="430" x2="700" y2="430"/><text class="fig-tick" x="82" y="434" text-anchor="end">0</text>
<line class="fig-grid" x1="214.5" y1="70" x2="214.5" y2="430"/><text class="fig-tick" x="214.5" y="446" text-anchor="middle">10</text>
<line class="fig-grid" x1="339" y1="70" x2="339" y2="430"/><text class="fig-tick" x="339" y="446" text-anchor="middle">20</text>
<line class="fig-grid" x1="463.4" y1="70" x2="463.4" y2="430"/><text class="fig-tick" x="463.4" y="446" text-anchor="middle">30</text>
<line class="fig-grid" x1="588" y1="70" x2="588" y2="430"/><text class="fig-tick" x="588" y="446" text-anchor="middle">40</text>
<line class="fig-grid" x1="700" y1="70" x2="700" y2="430"/><text class="fig-tick" x="700" y="446" text-anchor="middle">49</text>
<text class="fig-tick" x="90" y="446" text-anchor="middle">0</text>
<path d="M90 70 V430 H700" fill="none" stroke="var(--fig-muted, #888)" stroke-width="1"/>
<text class="fig-axis" x="395" y="472" text-anchor="middle">occupied cells before the move (of 49)</text>
<text class="fig-axis" transform="translate(22 250) rotate(-90)" text-anchor="middle">numbered clears per move</text>

<line x1="90" y1="286" x2="700" y2="286" stroke="var(--fig-accent, #2563eb)" stroke-width="1.5" stroke-dasharray="7 4"/>
<text class="fig-accent-text" x="696" y="278" text-anchor="end" font-size="11">requirement 2.400 = 12/5 (finding-01)</text>

<path d="M146 365.2 C 190 355, 210 350, 239.4 341.2 S 280 312, 301.6 300.4 S 340 270, 363.9 251.8 S 400 210, 426.1 177.4 S 465 120, 488.4 88" fill="none" stroke="var(--fig-accent, #2563eb)" stroke-width="2.5"/>
<path d="M146 377.8 C 195 366, 210 358, 239.4 347.2 S 280 322, 301.6 315.4 S 345 306, 363.9 304 S 400 282, 426.1 274.6 S 465 282, 488.4 294.4 S 530 322, 550.7 335.2 S 590 344, 612.9 346 S 650 360, 675.1 370" fill="none" stroke="var(--fig-fg, #222)" stroke-width="2" opacity="0.75"/>

<path d="M 288 318 C 300 310, 314 300, 328 290" fill="none" stroke="var(--fig-accent, #2563eb)" stroke-width="1.8" marker-end="url(#d4-arrA)"/>
<path d="M 394 256 C 382 264, 368 274, 352 284" fill="none" stroke="var(--fig-accent, #2563eb)" stroke-width="1.8" marker-end="url(#d4-arrA)"/>
<text class="fig-accent-text" x="240" y="372" text-anchor="middle" font-size="10">board fills → clears rise</text>
<text class="fig-accent-text" x="455" y="240" text-anchor="middle" font-size="10">board empties → clears fall</text>
<text class="fig-accent-text" x="331" y="262" text-anchor="end" font-size="11">≈20 cells — attracting fixed point</text>

<text x="438" y="262" font-size="10">fair D4 peak: 2.59 at 25–29 cells</text>
<path d="M 560 338 C 600 348, 630 358, 668 369" fill="none" stroke="var(--fig-danger, #dc2626)" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#d4-arrD)"/>
<text class="fig-danger-text" x="614" y="396" text-anchor="middle" font-size="10.5">deficit compounds — the death spiral</text>

<g class="fig-legend"><line x1="110" y1="84" x2="134" y2="84" stroke="var(--fig-accent, #2563eb)" stroke-width="2.5"/><text x="140" y="88">clairvoyant rh-clears (schematic)</text></g>
<g class="fig-legend"><line x1="110" y1="104" x2="134" y2="104" stroke="var(--fig-fg, #222)" stroke-width="2" opacity="0.75"/><text x="140" y="108">fair depth 4 (schematic)</text></g>

<rect x="36" y="496" width="688" height="34" rx="6" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-grid, #d4d4d8)"/>
<text x="380" y="510" text-anchor="middle" font-size="12">schematic — the measured curves are in the figure occupancy-clear-rate-equilibrium (finding-06 §3).</text>
<text class="fig-note" x="380" y="524" text-anchor="middle">the clairvoyant sits on an attracting fixed point; fair D4's clear rate falls past its peak, so for it crowding is irreversible</text>

<g class="fig-pt" tabindex="0"><title>The survival requirement</title><rect x="90" y="280" width="610" height="12" fill="transparent"/><circle class="fig-marker" cx="100" cy="286" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="100" y="289" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="110" y="200" width="430" height="64" rx="4"/><text x="118" y="215" font-size="11" font-weight="600">Exact disc conservation: 5 placed discs + 7 risen covered discs enter the</text><text x="118" y="230" font-size="11">49-cell board every five moves, so surviving requires 12/5 = 2.400 numbered</text><text x="118" y="245" font-size="11">clears per move (and 7/5 = 1.400 covered reveals, not shown).</text><text x="118" y="260" font-size="11">source: docs/exploratory/finding-01-score-is-survival.md</text></g></g>

<g class="fig-pt" tabindex="0"><title>The attracting fixed point at ~20 cells</title><path d="M146 365.2 C 190 355, 210 350, 239.4 341.2 S 280 312, 301.6 300.4 S 340 270, 363.9 251.8 S 400 210, 426.1 177.4 S 465 120, 488.4 88" fill="none" stroke="transparent" stroke-width="14"/><circle class="fig-marker" cx="339" cy="286" r="5.5" style="fill: var(--fig-accent, #2563eb)" stroke="var(--fig-pop-bg, #fff)" stroke-width="1.5"/><g class="fig-pop"><rect x="360" y="130" width="390" height="76" rx="4"/><text x="368" y="145" font-size="11" font-weight="600">Measured: the clairvoyant clear-seeker's rate rises through 2.400 near 20</text><text x="368" y="160" font-size="11">cells, and its occupancy held at 19–20 of 49 cells for 200 consecutive</text><text x="368" y="175" font-size="11">five-move cycles (slope −0.0015 cells/cycle; 2.4023 clears/move over moves</text><text x="368" y="190" font-size="11">501–1000 — above the requirement).</text><text x="368" y="205" font-size="11">source: docs/exploratory/finding-06-flow-ceiling.md §2.1, §3</text></g></g>

<g class="fig-pt" tabindex="0"><title>Restoring drift — negative feedback</title><rect x="280" y="250" width="120" height="80" fill="transparent"/><circle class="fig-marker" cx="410" cy="250" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="410" y="253" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="110" y="130" width="400" height="64" rx="4"/><text x="118" y="145" font-size="11" font-weight="600">Negative feedback: below the crossing the board fills and the achievable</text><text x="118" y="160" font-size="11">clear rate rises with occupancy; above it the board empties and the rate</text><text x="118" y="175" font-size="11">falls. The operating point is self-correcting — an attracting fixed point.</text><text x="118" y="190" font-size="11">source: finding-06 §3 (the occupancy-conditional mechanism)</text></g></g>

<g class="fig-pt" tabindex="0"><title>Fair D4's hump — no fixed point</title><path d="M146 377.8 C 195 366, 210 358, 239.4 347.2 S 280 322, 301.6 315.4 S 345 306, 363.9 304 S 400 282, 426.1 274.6 S 465 282, 488.4 294.4 S 530 322, 550.7 335.2 S 590 344, 612.9 346 S 650 360, 675.1 370" fill="none" stroke="transparent" stroke-width="14"/><circle class="fig-marker" cx="426.1" cy="274.6" r="4.5" style="fill: var(--fig-fg, #222)"/><g class="fig-pop"><rect x="430" y="130" width="320" height="76" rx="4"/><text x="438" y="145" font-size="11" font-weight="600">Fair D4 peaks at 2.59 clears/move in the 25–29-cell band —</text><text x="438" y="160" font-size="11">barely above the requirement — then falls: 2.26, 1.58, 1.40,</text><text x="438" y="175" font-size="11">1.00 in the higher bands. Its equilibrium is unstable: nudged</text><text x="438" y="190" font-size="11">past ~30 cells, it cannot get back.</text><text x="438" y="205" font-size="11">source: finding-06 §3 occupancy-conditional table</text></g></g>

<g class="fig-pt" tabindex="0"><title>The death spiral</title><rect x="550" y="330" width="130" height="50" fill="transparent"/><circle class="fig-marker" cx="640" cy="362" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="640" y="365" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="300" y="130" width="430" height="76" rx="4"/><text x="308" y="145" font-size="11" font-weight="600">Past ~30 cells D4's rate drops under the requirement and the shortfall</text><text x="308" y="160" font-size="11">compounds: occupancy slope +0.99 cells per five-move cycle on the eight</text><text x="308" y="175" font-size="11">tapes (+1.481 on 128 fresh tapes, finding-12 §2). Once crowded, games end</text><text x="308" y="190" font-size="11">quickly — which is why fair-D4 lifetime is heavy-tailed.</text><text x="308" y="205" font-size="11">source: finding-06 §3; finding-12 §2</text></g></g>
</svg>
