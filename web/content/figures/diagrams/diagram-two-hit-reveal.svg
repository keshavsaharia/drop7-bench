<!-- caption strip -->
<rect x="36" y="496" width="688" height="34" rx="6" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-grid, #d4d4d8)"/>
<text x="380" y="510" text-anchor="middle" font-size="12">two hits, one wave = reveal — the leaf priced the marginals, not the joint event.</text>
<text class="fig-note" x="380" y="524" text-anchor="middle">solid gray: 2 hits in one wave-scan · cracked gray: 1 hit · hits counted from the pre-clear board (resolveCascadeFast, fast-engine.hpp)</text>

<g class="fig-pt" tabindex="0"><title>Solid gray — the cover rule</title><rect x="120" y="300" width="20" height="20" fill="transparent"/><circle class="fig-marker" cx="204" cy="184" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="204" y="187" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="36" y="60" width="370" height="76" rx="4"/><text x="44" y="75" font-size="11" font-weight="600">Solid gray (covered disc). Each wave, poppers are marked first; then</text><text x="44" y="90" font-size="11">every covered cell counts its orthogonal neighbours in the popping set,</text><text x="44" y="105" font-size="11">read from the pre-clear board. Solid needs 2 hits in one wave to reveal;</text><text x="44" y="120" font-size="11">a solid that takes 1 hit becomes cracked (needs 1 more, any later wave).</text><text x="44" y="135" font-size="11">source: fast-engine.hpp, resolveCascadeFast cover scan</text></g></g>

<g class="fig-pt" tabindex="0"><title>Why the double hit is a cascade event</title><rect x="96" y="256" width="68" height="40" fill="transparent"/><circle class="fig-marker" cx="166" cy="262" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="166" y="265" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="36" y="60" width="370" height="76" rx="4"/><text x="44" y="75" font-size="11" font-weight="600">A cascade is underway: an earlier wave's pops and gravity deliver the</text><text x="44" y="90" font-size="11">completing discs (ghosted). Wave-1 poppers are always runs through the</text><text x="44" y="105" font-size="11">dropped cell, so a same-wave double hit on a solid gray is a wave-≥2</text><text x="44" y="120" font-size="11">event: gravity must complete runs on both sides in one scan.</text><text x="44" y="135" font-size="11">derived from resolveCascadeFast: scan → poppers → cover hits → gravity</text></g></g>

<g class="fig-pt" tabindex="0"><title>The joint event the leaf could not price</title><rect x="455" y="158" width="70" height="46" fill="transparent"/><circle class="fig-marker" cx="564" cy="64" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="564" y="67" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="300" y="60" width="420" height="76" rx="4"/><text x="308" y="75" font-size="11" font-weight="600">Both neighbours pop in the same wave-scan, so two hits land on the solid</text><text x="308" y="90" font-size="11">gray at once. This joint event is what the aligned_double_hit leaf term</text><text x="308" y="105" font-size="11">tried to price: solid_exposure is a weighted sum of the two neighbours'</text><text x="308" y="120" font-size="11">marginal readiness and cannot express it.</text><text x="308" y="135" font-size="11">source: web/content/log/2026-08-23.mdx, Kimi K3 design direction</text></g></g>

<g class="fig-pt" tabindex="0"><title>Reveal — and the cascade can continue</title><rect x="478" y="178" width="24" height="24" fill="transparent"/><circle class="fig-marker" cx="564" cy="88" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="564" y="91" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="300" y="60" width="420" height="64" rx="4"/><text x="308" y="75" font-size="11" font-weight="600">2 hits ≥ 2 needed: the gray reveals immediately (drawn as the revealed 4),</text><text x="308" y="90" font-size="11">and the revealed number can itself pop in a later wave of the same cascade —</text><text x="308" y="105" font-size="11">the cheapest reveal in the game. Reveals apply after poppers are removed,</text><text x="308" y="120" font-size="11">before gravity, in row-major order (resolveCascadeFast).</text></g></g>

<g class="fig-pt" tabindex="0"><title>Counterfactual — only cracked</title><rect x="478" y="418" width="24" height="24" fill="transparent"/><circle class="fig-marker" cx="564" cy="304" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="564" y="307" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="300" y="300" width="420" height="76" rx="4"/><text x="308" y="315" font-size="11" font-weight="600">Counterfactual: the hits arrive in different waves. The first hit only</text><text x="308" y="330" font-size="11">cracks the gray; the second never lands inside the search horizon.</text><text x="308" y="345" font-size="11">Marginally each neighbour looked ready — the leaf sees the same board</text><text x="308" y="360" font-size="11">either way, which is why a weighted sum of marginals cannot rank this.</text><text x="308" y="375" font-size="11">source: web/content/log/2026-08-23.mdx</text></g></g>

<g class="fig-pt" tabindex="0"><title>What the measurement showed</title><rect x="36" y="496" width="688" height="34" fill="transparent"/><circle class="fig-marker" cx="712" cy="504" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="712" y="507" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="160" y="406" width="480" height="76" rx="4"/><text x="168" y="421" font-size="11" font-weight="600">Measured in play (RS-20260823T131226Z-16564ed9): the +900 dose changed</text><text x="168" y="436" font-size="11">2.08% of decisions and scored +3,204 over 256 fresh paired games (95% lower</text><text x="168" y="451" font-size="11">bound −26,860), with reveals flat at 1.152 vs 1.154 per move — the term</text><text x="168" y="466" font-size="11">re-ranks the search occasionally and buys no reveals. The gate reads fail;</text><text x="168" y="481" font-size="11">60.5% of live same-wave setups go uncollected within two moves.</text></g></g>
</svg>
