<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="100%" role="img" aria-labelledby="fig-diagram-two-hit-reveal-title fig-diagram-two-hit-reveal-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-diagram-two-hit-reveal-title">The two-hit reveal: two hits in one wave-scan reveal a solid gray</title>
<desc id="fig-diagram-two-hit-reveal-desc">Mechanism diagram: the same-wave double hit behind the 2026-08-23 reveal-construction experiment. Board 1 (setup): a solid gray disc flanked on the bottom row by two numbered discs whose vertical runs are one short, with the completing discs being delivered by the ongoing cascade's gravity. Board 2 (actual): both neighbours pop in the same wave-scan, two hits land on the solid gray at once, and it reveals immediately. Board 3 (counterfactual): the hits arrive in different waves; the first only cracks the gray and the second never lands inside the search horizon. Engine rule per approaches/lifetime-objective/fast-engine/fast-engine.hpp resolveCascadeFast: poppers are marked first, then every covered cell counts its orthogonal neighbours in the popping set read from the pre-clear board; a solid gray needs 2 hits in one wave to reveal, a cracked gray needs 1. Caption: two hits, one wave = reveal; the leaf priced the marginals, not the joint event. Sources: web/content/log/2026-08-23.mdx, RS-20260823T131226Z-16564ed9, docs/agents/project-nature.md. Boards are 7x7, row 0 at top, columns 1-7 left to right.</desc>
