<g class="fig-pt" tabindex="0"><title>What a determinization is</title><rect x="76" y="82" width="268" height="30" fill="transparent"/><circle class="fig-marker" cx="352" cy="92" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="352" y="95" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="36" y="120" width="400" height="64" rx="4"/><text x="44" y="135" font-size="11" font-weight="600">One determinization: a single sampled future — disc tape, risen rows and</text><text x="44" y="150" font-size="11">hidden values — solved exactly. The clairvoyant line is optimal for this</text><text x="44" y="165" font-size="11">tape alone. The fair planner draws K such completions per decision.</text><text x="44" y="180" font-size="11">source: docs/exploratory/finding-07-fair-planning-ceiling.md, method</text></g></g>

<g class="fig-pt" tabindex="0"><title>Tape A optimum</title><rect x="456" y="122" width="32" height="68" fill="transparent"/><circle class="fig-marker" cx="556" cy="112" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="556" y="115" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="300" y="120" width="420" height="48" rx="4"/><text x="308" y="135" font-size="11" font-weight="600">On tape A the exact window optimum starts at column 2.</text><text x="308" y="150" font-size="11">The value is computed against this future only — no other tape enters it.</text><text x="308" y="165" font-size="11">Bar heights are illustrative; no measured per-tape values are recorded.</text></g></g>

<g class="fig-pt" tabindex="0"><title>Tape B optimum</title><rect x="576" y="312" width="32" height="68" fill="transparent"/><circle class="fig-marker" cx="680" cy="302" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="680" y="305" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="300" y="310" width="420" height="48" rx="4"/><text x="308" y="325" font-size="11" font-weight="600">On tape B the optimum starts at column 5 — a different, incompatible line.</text><text x="308" y="340" font-size="11">Each tape's optimal first move is bad on the other tape: the two plans</text><text x="308" y="355" font-size="11">disagree about what the board under the covers will do.</text></g></g>

<g class="fig-pt" tabindex="0"><title>The fused argmax — best on neither tape</title><rect x="496" y="480" width="32" height="50" fill="transparent"/><circle class="fig-marker" cx="600" cy="458" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="600" y="461" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="300" y="386" width="430" height="76" rx="4"/><text x="308" y="401" font-size="11" font-weight="600">The hindsight planner averages per-tape values and plays the argmax:</text><text x="308" y="416" font-size="11">column 3 — second-best on both tapes, best on neither. Measured: 51,500.5</text><text x="308" y="431" font-size="11">mean vs fair D3's 107,076; the ledger calls the per-tape root values</text><text x="308" y="446" font-size="11">"incompatible and overoptimistic" (history.md:797-799) — the single worst</text><text x="308" y="461" font-size="11">result in the corpus (audit-05 §4, experiment 3, class (iv)).</text></g></g>

<g class="fig-pt" tabindex="0"><title>Caption — the PIMC caveat</title><rect x="36" y="552" width="688" height="34" fill="transparent"/><circle class="fig-marker" cx="712" cy="560" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="712" y="563" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="160" y="460" width="480" height="64" rx="4"/><text x="168" y="475" font-size="11" font-weight="600">finding-07 §2: fixing the tape removes diversity from the K completions and</text><text x="168" y="490" font-size="11">sharpens strategy fusion — a determinized (PIMC) planner is not monotone in</text><text x="168" y="505" font-size="11">information. Arm A (tape known) scored no better than arm B: 2.1361 vs</text><text x="168" y="520" font-size="11">2.1403 clears/move at K=64 on the eight master tapes.</text></g></g>
</svg>
