<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="100%" role="img" aria-labelledby="fig-diagram-strategy-fusion-title fig-diagram-strategy-fusion-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-diagram-strategy-fusion-title">Strategy fusion: the hindsight average is optimal on neither tape</title>
<desc id="fig-diagram-strategy-fusion-desc">Mechanism diagram: strategy fusion in hindsight (PIMC) planning. Two determinizations — sampled futures of disc tape and hidden board — are each solved exactly: the clairvoyant optimum starts at column 2 on tape A and at column 5 on tape B (bar heights illustrative). The hindsight planner averages the per-tape values of each first move and plays the argmax, which lands on column 3, second-best on both tapes and best on neither, marked with a cross. Caption: averaging clairvoyant values across tapes fuses incompatible strategies. Explains docs/exploratory/audit-05-optimistic-curriculum.md section 4 experiment 3 (the hindsight planner, class (iv) objective mismatch) and the PIMC caveat of docs/exploratory/finding-07-fair-planning-ceiling.md. Bar heights and tape discs are illustrative; no measured numbers are drawn.</desc>
