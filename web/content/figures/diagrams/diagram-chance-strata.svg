<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="100%" role="img" aria-labelledby="fig-diagram-chance-strata-title fig-diagram-chance-strata-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-diagram-chance-strata-title">Disc strata: five samples cannot cover a seven-point uniform</title>
<desc id="fig-diagram-chance-strata-desc">Parameter diagram: what the chance-node sample count N does in the fair Drop7 search. Top row: at every chance node the next visible disc is uniform on seven values, each one atom of the expectation with true weight 1/7. Middle: N=5 strata (the frozen fair-D4 reference) continue with only five of the seven values, so at least two atoms get zero weight at every node, deterministically, and the bias never averages out; N=7 strata weight every atom 1/7, making the next-disc expectation exact. Bottom: the measured interaction — with 5 strata the fourth ply buys nothing measurable, with 7 strata it pays; depth and estimator quality are complements, which is why the exact seven-point expectation is what unlocks depth. Sources: docs/exploratory/finding-05-chance-strata.md and docs/exploratory/audit-02-fair-d4.md (H1). Measured numbers appear only inside hover popovers, with their records cited.</desc>
<style>
.research-fig-svg text { fill: var(--fig-fg, #222); }
.research-fig-svg .fig-title { font-size: 14px; font-weight: 600; }
.research-fig-svg .fig-sub { font-size: 11px; fill: var(--fig-muted, #888); }
.research-fig-svg .fig-note { font-size: 10px; fill: var(--fig-muted, #888); }
.research-fig-svg .fig-tiny { font-size: 9px; fill: var(--fig-muted, #888); }
.research-fig-svg .fig-grid { stroke: var(--fig-grid, #d4d4d8); stroke-width: 1; fill: none; }
.research-fig-svg .fig-accent-text { fill: var(--fig-accent, #2563eb); }
.research-fig-svg .fig-danger-text { fill: var(--fig-danger, #dc2626); }
.research-fig-svg .fig-pt { cursor: pointer; outline: none; }
.research-fig-svg .fig-pop { display: none; pointer-events: none; }
.research-fig-svg .fig-pop rect { fill: var(--fig-pop-bg, #ffffff); stroke: var(--fig-pop-border, #d4d4d8); }
.research-fig-svg .fig-pop text { fill: var(--fig-fg, #222); }
.research-fig-svg .fig-pt:hover .fig-pop, .research-fig-svg .fig-pt:focus .fig-pop, .research-fig-svg .fig-pt:focus-within .fig-pop { display: block; }
.research-fig-svg .fig-pt:hover .fig-marker, .research-fig-svg .fig-pt:focus .fig-marker { stroke: var(--fig-fg, #222); stroke-width: 2; }
</style>
<defs>
<marker id="cs-arrF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--fig-fg, #222)"/></marker>
<marker id="cs-arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--fig-accent, #2563eb)"/></marker>
<marker id="cs-arrM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--fig-muted, #888)"/></marker>
</defs>
<text class="fig-title" x="36" y="24">Disc strata: covering the seven-point next-disc uniform</text>
<text class="fig-sub" x="36" y="42">at every chance node the next disc is uniform on seven values — N is how many stratified samples the search averages over</text>

<!-- Row 1: the seven atoms -->
<text x="36" y="76" font-size="12" font-weight="600">the chance node — seven atoms</text>
<text x="36" y="94" font-size="11">after a drop resolves, the engine</text>
<text x="36" y="108" font-size="11">deals the next disc — uniform</text>
<text x="36" y="122" font-size="11">on seven values:</text>
<circle cx="262" cy="100" r="14" style="fill: var(--fig-accent, #2563eb)"/><text x="262" y="104" text-anchor="middle" font-size="11" style="fill: #fff">1</text>
<circle cx="308" cy="100" r="14" style="fill: var(--fig-accent, #2563eb)"/><text x="308" y="104" text-anchor="middle" font-size="11" style="fill: #fff">2</text>
<circle cx="354" cy="100" r="14" style="fill: var(--fig-accent, #2563eb)"/><text x="354" y="104" text-anchor="middle" font-size="11" style="fill: #fff">3</text>
<circle cx="400" cy="100" r="14" style="fill: var(--fig-accent, #2563eb)"/><text x="400" y="104" text-anchor="middle" font-size="11" style="fill: #fff">4</text>
<circle cx="446" cy="100" r="14" style="fill: var(--fig-accent, #2563eb)"/><text x="446" y="104" text-anchor="middle" font-size="11" style="fill: #fff">5</text>
<circle cx="492" cy="100" r="14" style="fill: var(--fig-accent, #2563eb)"/><text x="492" y="104" text-anchor="middle" font-size="11" style="fill: #fff">6</text>
<circle cx="538" cy="100" r="14" style="fill: var(--fig-accent, #2563eb)"/><text x="538" y="104" text-anchor="middle" font-size="11" style="fill: #fff">7</text>
<text class="fig-tiny" x="262" y="126" text-anchor="middle">1/7</text><text class="fig-tiny" x="308" y="126" text-anchor="middle">1/7</text><text class="fig-tiny" x="354" y="126" text-anchor="middle">1/7</text><text class="fig-tiny" x="400" y="126" text-anchor="middle">1/7</text><text class="fig-tiny" x="446" y="126" text-anchor="middle">1/7</text><text class="fig-tiny" x="492" y="126" text-anchor="middle">1/7</text><text class="fig-tiny" x="538" y="126" text-anchor="middle">1/7</text>
<text x="576" y="92" font-size="11">exact expectation:</text>
<text x="576" y="107" font-size="11">E[V] = (1/7) · Σ V(d)</text>
<text x="576" y="122" font-size="11">over all seven atoms</text>

<!-- Row 2, left panel: N = 5 -->
<rect x="36" y="150" width="340" height="150" rx="6" style="fill: none; stroke: var(--fig-grid, #d4d4d8)"/>
<text class="fig-danger-text" x="48" y="172" font-size="12" font-weight="600">N = 5 strata — the frozen reference</text>
<circle cx="62" cy="206" r="13" style="fill: var(--fig-accent, #2563eb)"/><text x="62" y="210" text-anchor="middle" font-size="10" style="fill: #fff">1</text>
<circle cx="108" cy="206" r="13" style="fill: var(--fig-accent, #2563eb)"/><text x="108" y="210" text-anchor="middle" font-size="10" style="fill: #fff">2</text>
<circle cx="154" cy="206" r="13" fill="none" stroke="var(--fig-muted, #888)" stroke-width="1" stroke-dasharray="3 2"/><text x="154" y="210" text-anchor="middle" font-size="10" class="fig-sub">3</text>
<circle cx="200" cy="206" r="13" style="fill: var(--fig-accent, #2563eb)"/><text x="200" y="210" text-anchor="middle" font-size="10" style="fill: #fff">4</text>
<circle cx="246" cy="206" r="13" style="fill: var(--fig-accent, #2563eb)"/><text x="246" y="210" text-anchor="middle" font-size="10" style="fill: #fff">5</text>
<circle cx="292" cy="206" r="13" fill="none" stroke="var(--fig-muted, #888)" stroke-width="1" stroke-dasharray="3 2"/><text x="292" y="210" text-anchor="middle" font-size="10" class="fig-sub">6</text>
<circle cx="338" cy="206" r="13" style="fill: var(--fig-accent, #2563eb)"/><text x="338" y="210" text-anchor="middle" font-size="10" style="fill: #fff">7</text>
<text class="fig-tiny" x="62" y="228" text-anchor="middle">1/5</text><text class="fig-tiny" x="108" y="228" text-anchor="middle">1/5</text><text class="fig-tiny" x="200" y="228" text-anchor="middle">1/5</text><text class="fig-tiny" x="246" y="228" text-anchor="middle">1/5</text><text class="fig-tiny" x="338" y="228" text-anchor="middle">1/5</text>
<text class="fig-tiny" x="154" y="228" text-anchor="middle" style="fill: var(--fig-danger, #dc2626)">0</text><text class="fig-tiny" x="292" y="228" text-anchor="middle" style="fill: var(--fig-danger, #dc2626)">0</text>
<text x="48" y="252" font-size="11">estimate = (1/5) · Σ over the 5 sampled values</text>
<text class="fig-note" x="48" y="270">two values are invisible at this node — and which two is</text>
<text class="fig-note" x="48" y="284">deterministic, so the bias never averages out</text>

<!-- Row 2, right panel: N = 7 -->
<rect x="384" y="150" width="340" height="150" rx="6" style="fill: none; stroke: var(--fig-grid, #d4d4d8)"/>
<text class="fig-accent-text" x="396" y="172" font-size="12" font-weight="600">N = 7 strata</text>
<circle cx="410" cy="206" r="13" style="fill: var(--fig-accent, #2563eb)"/><text x="410" y="210" text-anchor="middle" font-size="10" style="fill: #fff">1</text>
<circle cx="456" cy="206" r="13" style="fill: var(--fig-accent, #2563eb)"/><text x="456" y="210" text-anchor="middle" font-size="10" style="fill: #fff">2</text>
<circle cx="502" cy="206" r="13" style="fill: var(--fig-accent, #2563eb)"/><text x="502" y="210" text-anchor="middle" font-size="10" style="fill: #fff">3</text>
<circle cx="548" cy="206" r="13" style="fill: var(--fig-accent, #2563eb)"/><text x="548" y="210" text-anchor="middle" font-size="10" style="fill: #fff">4</text>
<circle cx="594" cy="206" r="13" style="fill: var(--fig-accent, #2563eb)"/><text x="594" y="210" text-anchor="middle" font-size="10" style="fill: #fff">5</text>
<circle cx="640" cy="206" r="13" style="fill: var(--fig-accent, #2563eb)"/><text x="640" y="210" text-anchor="middle" font-size="10" style="fill: #fff">6</text>
<circle cx="686" cy="206" r="13" style="fill: var(--fig-accent, #2563eb)"/><text x="686" y="210" text-anchor="middle" font-size="10" style="fill: #fff">7</text>
<text class="fig-tiny" x="410" y="228" text-anchor="middle">1/7</text><text class="fig-tiny" x="456" y="228" text-anchor="middle">1/7</text><text class="fig-tiny" x="502" y="228" text-anchor="middle">1/7</text><text class="fig-tiny" x="548" y="228" text-anchor="middle">1/7</text><text class="fig-tiny" x="594" y="228" text-anchor="middle">1/7</text><text class="fig-tiny" x="640" y="228" text-anchor="middle">1/7</text><text class="fig-tiny" x="686" y="228" text-anchor="middle">1/7</text>
<text x="396" y="252" font-size="11">estimate = (1/7) · Σ over all seven = E exactly</text>
<text class="fig-note" x="396" y="270">every atom carries its true weight: the next-disc</text>
<text class="fig-note" x="396" y="284">expectation is exact — this is what depth unlocks</text>

<!-- Row 3: the interaction -->
<text x="36" y="326" font-size="12" font-weight="600">why exactness unlocks depth — the interaction</text>
<text x="36" y="364" font-size="11">5 strata: depth 3 → 4</text>
<line x1="200" y1="360" x2="330" y2="360" stroke="var(--fig-muted, #888)" stroke-width="1.5" marker-end="url(#cs-arrM)"/>
<text x="344" y="364" font-size="11">the extra ply propagates a biased estimate — no measurable gain</text>
<text x="36" y="408" font-size="11">7 strata: depth 3 → 4</text>
<line x1="200" y1="404" x2="330" y2="404" stroke="var(--fig-accent, #2563eb)" stroke-width="2.5" marker-end="url(#cs-arrA)"/>
<text x="344" y="408" font-size="11">the same ply propagates signal — the fourth ply pays</text>
<text class="fig-note" x="36" y="440">each ply feeds the chance estimate into the next; depth and estimator quality are complements, not independent knobs</text>

<!-- caption strip -->
<rect x="36" y="460" width="688" height="68" rx="6" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-grid, #d4d4d8)"/>
<text x="380" y="478" text-anchor="middle" font-size="10.5" font-weight="600">five samples cannot represent seven atoms — the exact seven-point expectation is what the fourth ply spends itself on.</text>
<text class="fig-note" x="380" y="494" text-anchor="middle">N = 5: ≥ 2 of 7 values zero-weighted at every node, deterministically · N = 7: every atom weighted 1/7 · reveal sampling is a separate knob (M)</text>
<text class="fig-note" x="380" y="510" text-anchor="middle">the work bound is part of the result: 7-strata depth 4 exceeds the frozen 3,200,000 bound 3.7× and needs a declared 16,000,000</text>

<g class="fig-pt" tabindex="0"><title>What a stratum is</title><rect x="560" y="76" width="164" height="56" fill="transparent"/><circle class="fig-marker" cx="712" cy="82" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="712" y="85" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="36" y="140" width="400" height="76" rx="4"/><text x="44" y="155" font-size="11" font-weight="600">A stratum is one stratified sample of the next disc: the search</text><text x="44" y="170" font-size="11">continues once per sampled value and averages the continuations</text><text x="44" y="185" font-size="11">with weight 1/N. N is the --chance-samples / --disc-samples knob.</text><text x="44" y="200" font-size="11">The next disc itself is uniform on {1,…,7} — seven atoms.</text><text x="44" y="215" font-size="11">source: docs/exploratory/finding-05-chance-strata.md</text></g></g>

<g class="fig-pt" tabindex="0"><title>Five cannot cover seven</title><rect x="130" y="186" width="210" height="52" fill="transparent"/><circle class="fig-marker" cx="364" cy="156" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="364" y="159" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="36" y="60" width="420" height="90" rx="4"/><text x="44" y="75" font-size="11" font-weight="600">Five samples cannot represent seven atoms: at least two values get</text><text x="44" y="90" font-size="11">zero weight at every node. Audit-02 (H1) measured 2.41 of the 7</text><text x="44" y="105" font-size="11">values zero-weighted on average — and which values are missed is</text><text x="44" y="120" font-size="11">fixed by the node's deterministic stream, so the error never</text><text x="44" y="135" font-size="11">averages out. source: finding-05, citing audit-02-fair-d4.md H1</text></g></g>

<g class="fig-pt" tabindex="0"><title>Exactness — and what it bought</title><rect x="396" y="238" width="320" height="60" fill="transparent"/><circle class="fig-marker" cx="712" cy="156" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="712" y="159" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="300" y="60" width="424" height="90" rx="4"/><text x="308" y="75" font-size="11" font-weight="600">Seven strata put the true 1/7 weight on every atom: the next-disc</text><text x="308" y="90" font-size="11">expectation is exact. Measured at depth 4 on 64 previously unread</text><text x="308" y="105" font-size="11">seeds: +101,171 mean points (+34%) and +27.5 moves, 95% lower</text><text x="308" y="120" font-size="11">bound +47,457 (finding-05 confirmation cohort). Covered-disc reveals</text><text x="308" y="135" font-size="11">are still sampled — the reveal expectation is not exact (knob M).</text></g></g>

<g class="fig-pt" tabindex="0"><title>The interaction numbers</title><rect x="200" y="344" width="460" height="80" fill="transparent"/><circle class="fig-marker" cx="712" cy="320" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="712" y="323" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="140" y="140" width="500" height="90" rx="4"/><text x="148" y="155" font-size="11" font-weight="600">Paired 64-game deltas (finding-05): depth 4, 7−5 strata: +101,171</text><text x="148" y="170" font-size="11">[LB +47,457], 41-0-23. Depth 3, 7−5 strata: +7,276 [−45,961] n.s.</text><text x="148" y="185" font-size="11">7 strata, depth 4−3: +86,172 [+26,468]. 5 strata, depth 4−3: +7,723</text><text x="148" y="200" font-size="11">[−42,743] n.s. With a biased estimator the fourth ply buys nothing;</text><text x="148" y="215" font-size="11">with an exact one it is worth 86,000 points — complements.</text></g></g>

<g class="fig-pt" tabindex="0"><title>The work bound is part of the result</title><rect x="36" y="460" width="688" height="68" fill="transparent"/><circle class="fig-marker" cx="712" cy="468" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="712" y="471" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="120" y="290" width="520" height="90" rx="4"/><text x="128" y="305" font-size="11" font-weight="600">Worst-case depth-4 work with branching b = 7 columns × N strata:</text><text x="128" y="320" font-size="11">N=5 → b=35 → 3,134,950 (fits the frozen 3,200,000 bound with 2.1%</text><text x="128" y="335" font-size="11">headroom); N=7 → b=49 → 11,892,398 (exceeds it 3.7×). Left at the</text><text x="128" y="350" font-size="11">frozen bound a 7-strata run silently completes depth 3. The 7-strata</text><text x="128" y="365" font-size="11">arms declared 16,000,000. Measured work ratio 3.82× (predicted 3.79×).</text></g></g>
</svg>
