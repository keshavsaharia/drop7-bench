<!-- Panel 3: the ranking can flip -->
<text x="36" y="310" font-size="12" font-weight="600">why this can change which column looks best</text>
<text class="fig-danger-text" x="80" y="336" font-size="11" font-weight="600">M = 1 — one draw each</text>
<line x1="70" y1="440" x2="210" y2="440" stroke="var(--fig-grid, #d4d4d8)" stroke-width="1"/>
