<circle cx="435" cy="182" r="8.5" fill="none" stroke="var(--fig-muted, #888)" stroke-width="1" stroke-dasharray="3 2"/><text x="435" y="185.5" text-anchor="middle" font-size="9" class="fig-sub">?</text>
<circle cx="456" cy="182" r="8.5" fill="none" stroke="var(--fig-muted, #888)" stroke-width="1" stroke-dasharray="3 2"/><text x="456" y="185.5" text-anchor="middle" font-size="9" class="fig-sub">?</text>
