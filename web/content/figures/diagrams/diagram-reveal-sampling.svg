<!-- caption strip -->
<rect x="36" y="480" width="688" height="50" rx="6" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-grid, #d4d4d8)"/>
<text x="380" y="496" text-anchor="middle" font-size="12">M = 1 prices a column on one draw of the hidden value; M = 6 on the average of six CRN-matched draws.</text>
<text class="fig-note" x="380" y="511" text-anchor="middle">chance node = N disc strata × M reveal samples (finding-09) · the reveal axis saturates at M ≈ 6 (finding-16) · value drawn at reveal time</text>
<text class="fig-note" x="380" y="525" text-anchor="middle">measured: the M = 6 quadrature genuinely changes within-root move orderings (RS-20260823T225753Z-0fbd48c3)</text>

<g class="fig-pt" tabindex="0"><title>The reveal event — engine rule</title><rect x="44" y="100" width="220" height="70" fill="transparent"/><circle class="fig-marker" cx="276" cy="66" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="276" y="69" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="36" y="284" width="400" height="90" rx="4"/><text x="44" y="299" font-size="11" font-weight="600">Each cascade wave: poppers are marked, then covered cells count</text><text x="44" y="314" font-size="11">orthogonal neighbours in the pre-clear popping set. Solid gray:</text><text x="44" y="329" font-size="11">2 hits in one wave to reveal; 1 hit cracks it; cracked + 1 hit</text><text x="44" y="344" font-size="11">reveals. The revealed value is drawn at reveal time (audit-01 M2).</text><text x="44" y="359" font-size="11">source: fast-engine.hpp, resolveCascadeFast cover scan</text></g></g>

<g class="fig-pt" tabindex="0"><title>M = 1 — a single draw</title><rect x="548" y="114" width="160" height="28" fill="transparent"/><circle class="fig-marker" cx="700" cy="128" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="700" y="131" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="308" y="284" width="416" height="90" rx="4"/><text x="316" y="299" font-size="11" font-weight="600">M = 1 continues the stratum with one drawn reveal value. Finding-09</text><text x="316" y="314" font-size="11">found the unfactored search drew the next disc and the reveal from</text><text x="316" y="329" font-size="11">the same sample counter: with seven samples it saw 7 of the 49 joint</text><text x="316" y="344" font-size="11">(disc, reveal) atoms, perfectly correlated. Factoring into N × M and</text><text x="316" y="359" font-size="11">raising M is the fix. source: finding-09 / finding-16</text></g></g>

<g class="fig-pt" tabindex="0"><title>M = 6 — six CRN draws</title><rect x="630" y="170" width="90" height="28" fill="transparent"/><circle class="fig-marker" cx="712" cy="160" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="712" y="163" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="308" y="284" width="416" height="90" rx="4"/><text x="316" y="299" font-size="11" font-weight="600">M = 6 averages six reveal draws per disc stratum — 42 of the 49</text><text x="316" y="314" font-size="11">joint atoms (85.7%). At depth 3 this beat M = 1 by +64,116 points</text><text x="316" y="329" font-size="11">[95% lower bound +7,475] (finding-09). The axis saturates: M = 12</text><text x="316" y="344" font-size="11">(100% coverage) buys nothing measurable, −27,097 [−83,807, +31,209]</text><text x="316" y="359" font-size="11">(finding-16). Read M = 6 as a local optimum, not “more is better”.</text></g></g>

<g class="fig-pt" tabindex="0"><title>Measured: orderings genuinely change</title><rect x="564" y="352" width="160" height="104" fill="transparent"/><circle class="fig-marker" cx="712" cy="340" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="712" y="343" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="140" y="140" width="520" height="90" rx="4"/><text x="148" y="155" font-size="11" font-weight="600">RS-20260823T225753Z-0fbd48c3 (rung-2 guardrail, 6 CRN-matched roots,</text><text x="148" y="170" font-size="11">exact replay verified): the M = 1 search (fast-d3s7) vs the M = 6</text><text x="148" y="185" font-size="11">search (native D3 N7M6) — within-root move orderings (KM lifetime)</text><text x="148" y="200" font-size="11">agree at mean Kendall τ 0.370 (LB95 0.283, min 0.053), top-1 only</text><text x="148" y="215" font-size="11">4/6, worst at late-game roots: the M = 6 quadrature genuinely changes</text><text x="148" y="230" font-size="11">which column looks best.</text></g></g>

<g class="fig-pt" tabindex="0"><title>Why CRN matters</title><rect x="36" y="480" width="688" height="50" fill="transparent"/><circle class="fig-marker" cx="712" cy="488" r="6.5" style="fill: var(--fig-pop-bg, #fff)" stroke="var(--fig-muted, #888)"/><text x="712" y="491" text-anchor="middle" font-size="9" class="fig-sub">i</text><g class="fig-pop"><rect x="120" y="300" width="520" height="76" rx="4"/><text x="128" y="315" font-size="11" font-weight="600">Common random numbers: the same drawn tapes are reused across all</text><text x="128" y="330" font-size="11">sibling columns, so columns are compared on identical luck — the</text><text x="128" y="345" font-size="11">ranking reflects the position, not who happened to draw well. The</text><text x="128" y="360" font-size="11">rung-2 guardrail used CRN-matched roots with exact replay verified</text><text x="128" y="375" font-size="11">(RS-20260823T225753Z-0fbd48c3).</text></g></g>
</svg>
