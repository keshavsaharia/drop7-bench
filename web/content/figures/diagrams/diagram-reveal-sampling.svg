<text class="fig-tiny" x="436" y="454" text-anchor="middle">col 3</text>
<text class="fig-tiny" x="498" y="454" text-anchor="middle">col 5</text>
<text x="572" y="368" font-size="11">one lucky draw can</text>
<text x="572" y="384" font-size="11">make the wrong column</text>
