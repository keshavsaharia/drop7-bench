<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="100%" role="img" aria-labelledby="fig-diagram-reveal-sampling-title fig-diagram-reveal-sampling-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-diagram-reveal-sampling-title">Reveal sampling: averaging the hidden value a gray reveals</title>
<desc id="fig-diagram-reveal-sampling-desc">Parameter diagram: what the reveal-sample count M does in the factored fair Drop7 search. Panel 1: the reveal event — during a cascade a hit lands on a covered gray; a solid gray needs 2 hits in one wave to reveal, a first hit only cracks it, and a cracked gray needs 1 more hit; when it reveals, the engine draws its value at reveal time. Panel 2: the chance node is factored into N disc strata times M reveal samples; M=1 continues the stratum with a single drawn value, M=6 averages six continuations drawn with common random numbers — the same draws reused for every sibling column. Panel 3: why this can change which column looks best — under M=1 one lucky draw can make the wrong column look best, while the six-draw average prices the reveal rather than the draw, and the ranking can flip. Measured, the M=6 reveal quadrature genuinely changes within-root move orderings (hover popovers, citing RS-20260823T225753Z-0fbd48c3). Sources: docs/exploratory/finding-16-factored-reveal-sampling.md, docs/exploratory/finding-09-reveal-sampling.md, research/results/RS-20260823T225753Z-0fbd48c3.json, approaches/lifetime-objective/fast-engine/fast-engine.hpp resolveCascadeFast. Panels are schematic; no board position is drawn. Measured numbers appear only inside hover popovers.</desc>
