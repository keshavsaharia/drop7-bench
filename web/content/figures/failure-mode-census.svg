<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" width="100%" role="img" aria-labelledby="fig-failure-mode-census-title fig-failure-mode-census-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-failure-mode-census-title">Failure-mode census of 17 learned-policy experiments (primary assignment)</title>
<desc id="fig-failure-mode-census-desc">Failure-mode census of 17 learned-policy experiments (primary assignment). Primary assignments of the 17 experiments classified in audit-05 section 4; secondary assignments are not plotted. Class (v) has zero members and was actively refuted twice (experiments 15 and 16: more data and capacity made ranking worse, and training initialized at exact fair D4 walked away from it). Classes (i) and (iii) dominate: information gaps in the oracle targets, and within-root discrimination even with complete sibling coverage. Zero of the seventeen failures is an optimization/basin failure — the class the owner's curriculum-ordering hypothesis targets. Evidence tier: audit of the historical ledger. Sources: docs/exploratory/audit-05-optimistic-curriculum.md.</desc>
