<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" width="100%" role="img" aria-labelledby="fig-strata-5-vs-7-title fig-strata-5-vs-7-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-strata-5-vs-7-title">Paired contrasts in the depth x chance-resolution factorial (mean delta, one-sided 95% lower bound)</title>
<desc id="fig-strata-5-vs-7-desc">Paired contrasts in the depth x chance-resolution factorial (mean delta, one-sided 95% lower bound). Whisker is the one-sided 95% whole-game bootstrap lower bound; the upper end of the whisker is the point estimate itself (no upper bound is drawn). A contrast is significant when its lower bound clears zero: both stratum contrasts (7 minus 5 strata) do; neither depth contrast (5 minus 4 plies) does, and each sits below its own detection floor (47,052 at n=64, 107,988 at n=32). Cohort 0xa51d1000-0xa51d103f; the n=32 contrasts cover its first 32 seeds. Evidence tier: public-development. Sources: RS-20260821T205102Z-d89df4b5.</desc>
<style>
