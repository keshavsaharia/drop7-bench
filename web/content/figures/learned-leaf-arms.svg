<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" width="100%" role="img" aria-labelledby="fig-learned-leaf-arms-title fig-learned-leaf-arms-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-learned-leaf-arms-title">Learned leaf (LeafNet, w = 0.50) against the frozen reference leaf at depth 4: the 2x2</title>
<desc id="fig-learned-leaf-arms-desc">Learned leaf (LeafNet, w = 0.50) against the frozen reference leaf at depth 4: the 2x2. 64 paired whole games per arm on cohort 0xa51d1000-0xa51d103f, corrected scoring, 2,000-move cap. Marker labels are paired wins-ties-losses of the learned leaf against the reference on the same seeds. The learned-minus-reference paired delta is +39,105 at five strata (one-sided 95% lower bound +1,138, significant) and +17,281 at seven strata (lower bound -55,892, not significant); the difference-in-differences is -21,824 (lower bound -105,254), which refuted the preregistered prediction that the learned leaf would help more with the exact estimator. Evidence tier: development (finding-08; no result record was written for this finding). Sources: docs/exploratory/finding-08-learned-leaf.md.</desc>
