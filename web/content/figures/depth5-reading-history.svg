<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" width="100%" role="img" aria-labelledby="fig-depth5-reading-history-title fig-depth5-reading-history-desc" class="research-fig-svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="fig-depth5-reading-history-title">The d5s7-minus-d4s7 paired reading as the cohort grew — wrong twice, then unmeasurable</title>
<desc id="fig-depth5-reading-history-desc">The d5s7-minus-d4s7 paired reading as the cohort grew — wrong twice, then unmeasurable. The three recorded readings of the depth-5-minus-depth-4 seven-stratum contrast on cohort 0xa51d1000-0xa51d103f (corrected 17,000-point Hardcore scoring). n=8 is completion-order biased against d5s7 (finding-15 section 2.2 warns of exactly this) and carries no bootstrap bound — the source states none is quoted at n=8 because it would not be meaningful. n=16 was reported as a wash and withdrawn in finding-15 section 10 as a non-measurement reported as a null. n=32 is final: the arm was stopped by decision at the chunk boundary and will not be resumed; +23,367 is equally unsupported (22% of its floor), so the correct statement is that the contrast was never measured. Whiskers are one-sided 95% bootstrap lower bounds where recorded. The detection floor (1.645 x sd / sqrt(n)) at n=8 is not recorded anywhere, so the floor series starts at n=16. Resolving the observed +23,367 would need about 684 paired games (RS-20260821T205102Z-d89df4b5). Evidence tier: public-development. Sources: docs/exploratory/finding-15-depth5-exact-estimator.md, RS-20260821T205102Z-d89df4b5.</desc>
