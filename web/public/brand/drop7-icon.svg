<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title description">
  <title id="title">Drop7 disc 7</title>
  <desc id="description">A white number 7 on the blue Drop7 game disc.</desc>
  <defs>
    <mask id="lower-shade" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
      <rect width="1000" height="1000" fill="#000000" />
      <circle cx="500" cy="500" r="480" fill="#ffffff" />
      <circle cx="500" cy="440" r="480" fill="#000000" />
    </mask>
  </defs>
  <circle cx="500" cy="500" r="480" fill="#405db0" />
  <rect
    width="1000"
    height="1000"
    fill="#000000"
    fill-opacity="0.22"
    mask="url(#lower-shade)"
  />
  <circle
    cx="500"
    cy="500"
    r="480"
    fill="none"
    stroke="#000000"
    stroke-opacity="0.15"
    stroke-width="20"
  />
  <text
    x="500"
    y="510"
    fill="#ffffff"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="520"
    font-weight="700"
    text-anchor="middle"
    dominant-baseline="central"
  >7</text>
</svg>
